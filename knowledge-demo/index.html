<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식관리 — 가상 자료 체험판</title>
<meta name="description" content="지식관리 도구의 구성과 업무 흐름을 눌러 보는 체험판입니다. 자료는 전부 가상이며 AI를 사용하지 않습니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2320344A'/%3E%3Cpath d='M22 16h14l10 10v22H22z' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M36 16v10h10M27 34h12M27 40h12' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="demo.css">
</head>
<!-- 체험판 전용 루트 클래스 — 화면 개편은 전부 demo.css 안에서 .km-demo 아래로 관리한다.
     style.css(로컬 앱과 같은 파일)는 건드리지 않는다. -->
<body class="km-demo">

<div id="layout">

  <!-- 좌: 도구 이름 · 펀드/사업장 트리 · 팀 공통 지식 · 도구 목록으로 돌아가기.
       여기서 고른 대상이 아래 탭과 검색의 기본 범위를 정한다. -->
  <nav id="sidebar" aria-label="펀드 · 사업장">
    <div class="side-brand">
      <span class="side-brand-name">지식관리</span>
      <span class="side-brand-sub">가상 자료 체험판</span>
    </div>
    <div class="side-head">펀드 · 사업장</div>
    <div id="tree"></div>
    <button id="teamLink" class="tree-team" type="button">팀 공통 지식</button>
    <!-- 도구 이동 — 통합 지시서가 네 도구 전환을 모든 화면에 두라고 했다.
         브리프의 사이드바 구조를 지키면서 아래쪽에 함께 둔다.
         세 도구가 데이터를 주고받는다는 뜻이 아니라 이동용이다. -->
    <div class="side-tools">
      <div class="side-tools-head">다른 도구</div>
      <a class="side-tool demo-home" href="../index.html">업무지원 도구 목록</a>
      <a class="side-tool" href="../CRE_재무모델_빌더.html">재무모델</a>
      <a class="side-tool" href="../업무_캘린더.html">업무 캘린더</a>
      <span class="side-tool side-tool-cur" aria-current="page">지식관리 체험판</span>
    </div>
  </nav>

  <div id="main">

    <header id="topbar">
      <div class="top-left">
        <div id="crumb">펀드 / 사업장</div>
        <h1 id="pageTitle">사업장 지식관리</h1>
      </div>
      <div class="top-actions">
        <span class="badge-sample">예시 데이터</span>
        <button id="demoReset" type="button">체험 초기화</button>
      </div>
    </header>

    <!-- 얇은 안내줄 — 체험판임을 항상 한 줄로 알린다(경고 띠가 아니다). -->
    <div id="demoBar">
      <span class="demo-txt">가상 자료 체험판 · AI 미사용 · 변경은 이 브라우저에만 저장</span>
      <span id="saveWarn" class="save-warn" hidden>저장 실패 — 이 탭에서만 임시로 유지됩니다. 새로고침하면 사라질 수 있습니다.</span>
    </div>

    <main id="center">
      <!-- 검색 — 넓은 입력 하나와 범위·버전 컨트롤을 같은 줄에 둔다.
           검색어가 있으면 아래 현황 그리드를 접고 결과가 주 작업 영역을 쓴다. -->
      <section id="searchBar">
        <div class="km-search-row">
          <span class="km-search-field">
            <svg class="km-ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input id="searchBox" type="text" aria-label="자료 검색" placeholder="제목·본문에서 찾기 (예: 임차인 조건, 회신 예정일)">
          </span>
          <label id="searchScopeLabel" class="km-ctl">범위
            <select id="searchScope">
              <option value="scoped">현재 사업장</option>
              <option value="all">전체 — 모든 펀드·사업장·팀 공통</option>
            </select>
          </label>
          <label id="searchOldVersions" class="km-ctl"><input type="checkbox" id="includeOldVersions"> 이전 버전 포함</label>
          <button id="searchClose" class="km-btn-quiet" type="button" hidden>검색 닫기</button>
        </div>
        <div id="searchScopeNote" class="km-help"></div>
        <div id="searchResults"></div>
      </section>

      <div id="tabs" role="tablist">
        <button class="tab active" data-tab="status">현황</button>
        <button class="tab" data-tab="documents">자료</button>
        <button class="tab" data-tab="activities">업무 이력</button>
        <button class="tab" data-tab="sync">갱신 체험</button>
      </div>
      <div id="panel-status" class="panel active"></div>
      <div id="panel-documents" class="panel"></div>
      <div id="panel-activities" class="panel"></div>
      <div id="panel-sync" class="panel"></div>

      <!-- 변경 검토 — 탭이 아니라 현황의 「확인할 변경」 카드에서 들어온다. -->
      <div id="panel-review" class="panel">
        <div class="km-view-head">
          <button id="reviewBack" class="km-btn-quiet" type="button">현황으로 돌아가기</button>
          <h2>변경 검토</h2>
        </div>
        <div id="side-review"><p class="hint">불러오는 중…</p></div>
      </div>
    </main>
  </div>

  <!-- 우: 근거 원문. 기본은 닫혀 있고 결과·근거 칩을 누를 때만 열린다.
       넓은 화면에서는 나란히, 좁은 화면에서는 드로어로 뜬다. -->
  <aside id="side" hidden aria-label="근거 원문">
    <section id="evidencePane">
      <div class="pane-head">
        <span class="pane-title">근거 원문</span>
        <button id="viewerClose" type="button">닫기</button>
      </div>
      <div id="viewerBody"></div>
    </section>
  </aside>
</div>

<!-- 어댑터가 먼저 실행돼 fetch 를 가로챈 뒤에 화면 코드가 돈다.
     (일반 스크립트는 지연 모듈보다 먼저 실행된다) -->
<script src="demo-api.js"></script>
<script type="module" src="app.js"></script>
<script>
  document.getElementById('demoReset').addEventListener('click', function () {
    if (confirm('체험 중 바꾼 내용을 모두 지우고 처음 상태로 되돌립니다.\n(이 브라우저의 체험판 저장값만 지웁니다 — 재무모델·캘린더는 건드리지 않습니다)')) {
      window.__kmDemoReset();
    }
  });
  /* 요구 5-2 — localStorage 쓰기가 막히면 조용히 넘기지 않고 그대로 알린다.
     저장 «성공»을 알리는 배지·토스트는 두지 않는다(성공은 기본 기대값이다). */
  document.addEventListener('km-demo-save-state', function (e) {
    document.getElementById('saveWarn').hidden = !!(e.detail && e.detail.ok);
  });
</script>
</body>
</html>
